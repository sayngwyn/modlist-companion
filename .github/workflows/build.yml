name: Standalone source contract

on:
  push:
    branches:
      - master
      - reconstruction/main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  standalone-tests:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Run standalone tests
        run: python -m pytest -q

  # Native release artifacts are deliberately not produced in hosted CI.
  # They require the exact Qt 6.7.1 and uibase inputs named by the checked-in
  # locks, plus clean-source pre/post checks and post-link record validation.
